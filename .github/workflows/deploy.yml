name: Scrape & deploy

on:
  schedule:
    - cron: '0 10 * * *' # daily, ~6am Toronto
  workflow_dispatch:
    inputs:
      source:
        description: 'scrape here, or publish the deals.json uploaded by the desktop updater'
        type: choice
        options: [scrape, local]
        default: scrape
  push:
    branches: [master]
    paths: ['frontend/**', 'scraper/**', 'config.json', 'merge-local.js', '.github/workflows/deploy.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: inputs.source != 'local'
      - run: npm test
        if: inputs.source != 'local'
      - run: npx playwright install --with-deps chromium
        if: inputs.source != 'local'
      - run: npm run scrape
        if: inputs.source != 'local'
      # Desktop updater uploads its run to the 'site-data' release; publish it, or backfill from it
      - name: Merge local data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh release download site-data -p deals.json -O local-deals.json || true
          node merge-local.js local-deals.json data/deals.json ${{ inputs.source == 'local' && '--replace' || '' }}
      - name: Assemble site
        run: |
          mkdir _site
          cp -r frontend/* config.json data/deals.json _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
