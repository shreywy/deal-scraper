name: Scrape & deploy

on:
  schedule:
    - cron: '0 10 * * *' # daily, ~6am Toronto
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['frontend/**', 'scraper/**', 'config.json', '.github/workflows/deploy.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run scrape
      - name: Assemble site
        run: |
          mkdir _site
          cp -r frontend/* config.json data/deals.json _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
