<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dealsco — Canadian sale finder</title>
<meta name="description" content="Sale items from Canadian retailers, refreshed daily.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f3d2b'/%3E%3Cpath d='M10 9h6.5a7 7 0 0 1 0 14H10z' fill='none' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = JSON.parse(t); } catch (_) {}</script>
</head>
<body>
<header class="header">
  <div class="bar">
    <a class="wordmark" href="./">dealsco</a>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search brands, products…" autocomplete="off" aria-label="Search deals">
      <kbd aria-hidden="true">/</kbd>
    </div>
    <div class="meta-wrap">
      <button class="meta" id="meta" aria-haspopup="dialog" aria-expanded="false"><i></i><span id="metaText">Loading…</span></button>
      <div class="popover" id="storesPop" role="dialog" aria-label="Store status" hidden></div>
    </div>
    <button class="iconbtn live-only" id="refreshBtn" aria-label="Refresh deals now" title="Refresh deals now">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button class="iconbtn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
  <nav class="depts" role="tablist" aria-label="Department">
    <button class="dept" role="tab" data-dept="Men">Men</button>
    <button class="dept" role="tab" data-dept="Women">Women</button>
    <button class="dept" role="tab" data-dept="Kids">Kids</button>
    <button class="dept" role="tab" data-dept="All">Everyone</button>
    <span class="dept-sep" aria-hidden="true"></span>
    <button class="dept" role="tab" data-dept="Home">Home &amp; Tech</button>
  </nav>
</header>

<div class="layout">
  <aside class="side" id="side" aria-label="Filters"></aside>
  <main class="main">
    <div class="toolbar">
      <button class="mfilters" id="openSheet">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        Filters<span id="fcount"></span>
      </button>
      <div class="count" id="count" aria-live="polite"></div>
      <div class="chips" id="chips"></div>
      <label class="sort"><span>Sort</span>
        <select id="sort">
          <option value="discount">Biggest discount</option>
          <option value="low">Price: low to high</option>
          <option value="high">Price: high to low</option>
          <option value="saved">Most saved ($)</option>
        </select>
      </label>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Filters" aria-modal="true">
  <header>Filters
    <button class="iconbtn" id="closeSheet" aria-label="Close filters"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </header>
  <div class="sbody" id="sheetBody"></div>
  <footer><button id="applySheet">Show results</button></footer>
</div>

<script src="app.js"></script>
</body>
</html>
